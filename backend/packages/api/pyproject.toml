[project]
name = "codecraft-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dr-Aniekan-Udo", email = "aniekanetimudo@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "codecraft-storage",
    "cryptography>=50.0.2",
    "fastapi>=0.162.2",
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
codecraft-storage = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
