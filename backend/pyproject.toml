[project]
name = "codecraft-workspace"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 100
target-version = "py314"
# Fixtures are input data, not workspace code, and are never linted.
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["packages"]
exclude = ["fixtures"]

[tool.pytest.ini_options]
testpaths = ["packages"]

[tool.importlinter]
root_packages = [
  "codecraft_core", "codecraft_settings", "codecraft_parsing",
  "codecraft_analysis", "codecraft_storage", "codecraft_explain",
  "codecraft_api", "codecraft_app",
]

[[tool.importlinter.contracts]]
name = "Core imports nothing internal"
type = "forbidden"
source_modules = ["codecraft_core"]
forbidden_modules = [
  "codecraft_parsing", "codecraft_analysis", "codecraft_storage",
  "codecraft_explain", "codecraft_api",
]

[[tool.importlinter.contracts]]
name = "Parsing and analysis stay independent of delivery"
type = "forbidden"
source_modules = ["codecraft_parsing", "codecraft_analysis"]
forbidden_modules = ["codecraft_storage", "codecraft_explain", "codecraft_api"]

[[tool.importlinter.contracts]]
name = "Common parsing code imports no language parser"
type = "forbidden"
source_modules = ["codecraft_parsing.common"]
forbidden_modules = [
  "codecraft_parsing.python",
  "codecraft_parsing.go",
]

[[tool.importlinter.contracts]]
name = "Python parser imports no Go parser"
type = "forbidden"
source_modules = ["codecraft_parsing.python"]
forbidden_modules = ["codecraft_parsing.go"]

[[tool.importlinter.contracts]]
name = "Go parser imports no Python parser"
type = "forbidden"
source_modules = ["codecraft_parsing.go"]
forbidden_modules = ["codecraft_parsing.python"]

[[tool.importlinter.contracts]]
name = "API imports no parser"
type = "forbidden"
source_modules = ["codecraft_api"]
forbidden_modules = ["codecraft_parsing"]

[[tool.importlinter.contracts]]
name = "Nothing imports the app"
type = "forbidden"
source_modules = [
  "codecraft_core", "codecraft_settings", "codecraft_parsing",
  "codecraft_analysis", "codecraft_storage", "codecraft_explain",
  "codecraft_api",
]
forbidden_modules = ["codecraft_app"]

[[tool.importlinter.contracts]]
name = "Parser imports no configuration, API or app"
type = "forbidden"
source_modules = ["codecraft_parsing"]
forbidden_modules = ["codecraft_settings", "codecraft_api", "codecraft_app"]

[[tool.importlinter.contracts]]
name = "Settings imports no other internal package"
type = "forbidden"
source_modules = ["codecraft_settings"]
forbidden_modules = [
  "codecraft_api", "codecraft_parsing", "codecraft_storage", "codecraft_app",
]

[[tool.importlinter.contracts]]
name = "Core imports no settings"
type = "forbidden"
source_modules = ["codecraft_core"]
forbidden_modules = ["codecraft_settings"]

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "jsonschema>=4.26.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
