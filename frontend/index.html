<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CodeCraft maps how a codebase depends on itself." />
    <title>CodeCraft</title>
    <script>
      // The invitation ticket must not be consumed by Clerk on page load.
      // Seeing the invitation is not accepting it; the page exposes an explicit
      // Accept button. Remove the ticket before the Clerk provider starts.
      ;(function () {
        var url = new URL(window.location.href)
        if (
          url.searchParams.has('__clerk_ticket') ||
          url.searchParams.has('__clerk_status')
        ) {
          url.searchParams.delete('__clerk_ticket')
          url.searchParams.delete('__clerk_status')
          window.history.replaceState({}, '', url.pathname + url.search + url.hash)
        }
      })()
    </script>
    <script>
      ;(function () {
        var preference = 'system'
        try {
          var stored = window.localStorage.getItem('codecraft-theme')
          if (stored === 'light' || stored === 'dark' || stored === 'system') {
            preference = stored
          }
        } catch (error) {
          preference = 'system'
        }

        var resolved = preference === 'dark' ? 'dark' : 'light'
        try {
          if (preference === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
        } catch (error) {
          resolved = 'light'
        }

        document.documentElement.dataset.theme = resolved
        document.documentElement.style.colorScheme = resolved
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
